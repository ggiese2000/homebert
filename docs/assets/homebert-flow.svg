<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">homeBert local control flow</title>
  <desc id="desc">A Nubert nuXinema receiver connects by Bluetooth Low Energy to homeBert on an M5Stack ATOM Lite, which connects by Wi-Fi to Apple Home.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#162b46"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fb3d9"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" fill="#d9ecff" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">LOCAL • DIRECT • NO CLOUD</text>
  <path d="M330 180 H485" stroke="#8fb3d9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M715 180 H870" stroke="#8fb3d9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="406" y="155" text-anchor="middle" fill="#9fc6ea" font-family="Arial, sans-serif" font-size="18">Bluetooth LE</text>
  <text x="792" y="155" text-anchor="middle" fill="#9fc6ea" font-family="Arial, sans-serif" font-size="18">Wi-Fi + HomeKit</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="105" width="260" height="150" rx="22" fill="#142a40" stroke="#4f7499" stroke-width="2"/>
    <rect x="102" y="137" width="196" height="64" rx="9" fill="#263f59"/>
    <circle cx="128" cy="169" r="9" fill="#72e0d1"/>
    <path d="M155 153 H265 M155 169 H242 M155 185 H277" stroke="#a7c7e2" stroke-width="7" stroke-linecap="round"/>
    <text x="200" y="230" text-anchor="middle" fill="#f2f8ff" font-size="24" font-weight="bold">nuXinema preAV</text>
    <text x="200" y="278" text-anchor="middle" fill="#9fc6ea" font-size="17">The real source of truth</text>
    <rect x="485" y="82" width="230" height="196" rx="28" fill="url(#bridge)"/>
    <rect x="541" y="115" width="118" height="82" rx="16" fill="#0d2941" opacity=".92"/>
    <circle cx="570" cy="156" r="12" fill="#2dd4bf"/>
    <circle cx="603" cy="156" r="12" fill="#f7d36d"/>
    <circle cx="630" cy="156" r="12" fill="#f17c8d"/>
    <text x="600" y="232" text-anchor="middle" fill="#06243a" font-size="27" font-weight="bold">homeBert</text>
    <text x="600" y="257" text-anchor="middle" fill="#0c3a52" font-size="16">M5Stack ATOM Lite</text>
    <rect x="870" y="105" width="260" height="150" rx="22" fill="#142a40" stroke="#4f7499" stroke-width="2"/>
    <path d="M964 157 C985 135 1015 135 1036 157" fill="none" stroke="#8fb3d9" stroke-width="7" stroke-linecap="round"/>
    <path d="M978 174 C992 160 1008 160 1022 174" fill="none" stroke="#8fb3d9" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1000" cy="190" r="7" fill="#8fb3d9"/>
    <text x="1000" y="230" text-anchor="middle" fill="#f2f8ff" font-size="24" font-weight="bold">Apple Home</text>
    <text x="1000" y="278" text-anchor="middle" fill="#9fc6ea" font-size="17">Your home, your controls</text>
  </g>
</svg>
